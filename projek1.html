<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        .nav {
            display: flex;
            width: 100%;
            height: 3rem;
            background-color: rgb(157, 225, 248);
            color: antiquewhite;
            justify-content: space-between;
            padding: 0px 5px;
            align-items: center;
        }
        
        .nav ul {
            list-style: none;
            display: flex;
            gap: 3rem;
        }
        
        .tekscenter {
            text-align: center;
        }
        
        .mt {
            margin-top: 5rem;
        }
        
        .md {
            text-align: center;
            margin-bottom: 3rem;
            padding: 3 rem;
        }
        
        .container {
            display: flex;
            justify-content: space-evenly;
            gap: 4rem;
            padding: 2rem;
            flex-wrap: wrap;
        }
        
        .card {
            width: 10rem;
            min-height: 15rem;
            background-color: rgb(224, 248, 248);
            padding: 2rem;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>

<body>
    <div class="nav">
        <h1>portopolio</h1>

        <ul>
            <li> home</li>
            <li> about</li>
            <li> projek</li>
        </ul>
    </div>
    <section>
        <h1 class="teks-center mt md">projek</h1>
    </section>
    <section>
        <div class="container">
            <div class="card">
                <h3>projek</h3>
                <p> deskripsi projek kamu</p>
            </div>
            <div class="card">
                <h3>web</h3>
                <p>aplikasi web</p>
            </div>
            <div class="card">
                <h3>web pos</h3>
                <p>aplikasi pencatat ponit</p>
            </div>
        </div>
    </section>
</body>

</html>
